services:
  postgres:
    image: postgres:16
    container_name: companion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: companion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - companion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d companion"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: companion-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/companion
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: replace-this-with-a-long-random-production-secret-32-chars-minimum
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - companion_uploads:/app/uploads

volumes:
  companion_pgdata:
  companion_uploads:
