spring.application.name=companion-backend
# Active profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# Server
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api
server.forward-headers-strategy=framework
# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Hikari
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
# Multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Management
management.endpoints.web.exposure.include=health,info,metrics
# JWT
app.security.jwt-secret=${JWT_SECRET:local-development-secret-change-this-before-production-123456789}
app.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:86400000}
# File storage
app.storage.upload-dir=${UPLOAD_DIR:./uploads}
# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}